<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C0A1E">
        <animate attributeName="stop-color" values="#5C0A1E;#8B1538;#4A0716;#5C0A1E" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B1538">
        <animate attributeName="stop-color" values="#8B1538;#4A0716;#A3204A;#8B1538" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Fond animé -->
  <rect width="900" height="200" rx="18" fill="url(#bg)"/>

  <!-- Halos lumineux qui bougent -->
  <circle cx="120" cy="40" r="110" fill="#FFFFFF" opacity="0.07">
    <animate attributeName="cx" values="120;780;120" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="170" r="140" fill="#FF6B8A" opacity="0.08">
    <animate attributeName="cy" values="170;30;170" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Titre : Prénom Nom -->
  <text x="450" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" fill="#FFFFFF">
    [Prénom] [Nom]
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Sous-titre -->
  <text x="450" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" fill="#FFFFFF" opacity="0.9">
    Étudiant BTS SIO · En recherche d'alternance
    <animate attributeName="opacity" from="0" to="0.9" begin="0.6s" dur="1.5s" fill="freeze"/>
  </text>
</svg>
